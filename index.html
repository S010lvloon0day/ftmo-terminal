<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Терминал FTMO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Терминал: тёмная графитовая основа, плотная сетка, цифры выровнены по разрядам.
   Цвет несёт только смысл: зелёный — прибыль, красный — убыток, янтарный — внимание, синий — выбранное. */
:root{
  --bg:#0f141b; --panel:#151c25; --raise:#1c2531; --line:#243041;
  --text:#e2e8f0; --dim:#8593a6; --faint:#5a687b;
  --up:#25c48f; --down:#f05a6c; --warn:#f2b84b; --sel:#6ea8fe;
  --up-bg:rgba(37,196,143,.12); --down-bg:rgba(240,90,108,.12); --warn-bg:rgba(242,184,75,.14); --sel-bg:rgba(110,168,254,.14);
  --font:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.35 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:4px}
.n{font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}.dim{color:var(--dim)}.warn{color:var(--warn)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* верхняя строка */
.top{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;height:40px;font-size:12px;color:var(--dim);white-space:nowrap}
.top .who{min-width:0;overflow:hidden;text-overflow:ellipsis}
.led{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.led.on{background:var(--up);box-shadow:0 0 6px var(--up)}
.led.off{background:var(--down)}
.top b{color:var(--text);font-weight:600}
.top .sp{margin-left:auto;text-align:right}

/* полоса счёта */
.acct{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:14px 0 12px;align-items:end}
.acct .eq{font-size:30px;font-weight:600;letter-spacing:-.5px;line-height:1}
.acct .eq small{font-size:13px;color:var(--dim);font-weight:500;margin-left:4px;letter-spacing:0}
.acct .chg{font-size:13px;display:flex;gap:4px 12px;justify-content:flex-end;flex-wrap:wrap}
.acct .chg span{color:var(--dim)}
.limits{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.lim{background:var(--panel);padding:8px 10px;min-width:0}
.lim .k{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.lim .v{font-size:15px;font-weight:600;margin:2px 0 6px}
.lim .v small{font-size:11px;font-weight:400;color:var(--dim)}
.meter{height:4px;background:var(--raise);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sel)}
.meter i.ok{background:var(--up)}.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--down)}
.pips{display:flex;gap:3px}.pips i{flex:1;height:4px;border-radius:2px;background:var(--raise)}.pips i.on{background:var(--up)}

/* сводка */
.tape{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.tape::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;white-space:nowrap}
.chip span{color:var(--dim)}
.chip b{font-weight:600}

/* панели */
.pnl{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;min-height:40px}
.ph h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.1px}
.ph .note{font-size:11px;color:var(--dim)}
.tabs{display:flex;margin-left:auto;background:var(--raise);border-radius:6px;padding:2px;flex:none}
.tabs button{font-size:11px;font-weight:600;color:var(--dim);padding:4px 8px;border-radius:4px;min-width:34px}
.tabs button[aria-pressed=true]{background:var(--line);color:var(--text)}

/* графики */
.chart{position:relative;padding:0 0 6px;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;top:2px;pointer-events:none;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:2}
.tip b{font-size:13px}
.tip .t{color:var(--dim);font-size:11px}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 12px 10px;font-size:11px;color:var(--dim)}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:5px;border-radius:1px}

/* рейтинг */
.lb-head,.lb-row{display:grid;grid-template-columns:18px minmax(0,1fr) 56px 76px 12px;gap:8px;align-items:center;padding:0 12px}
.lb-head{font-size:10.5px;color:var(--faint);height:24px;border-top:1px solid var(--line)}
.lb-head span:nth-child(4){text-align:right}
.lb-row{width:100%;text-align:left;min-height:54px;border-top:1px solid var(--line)}
.lb-row:active{background:var(--raise)}
.lb-row.fail{opacity:.55}
.rk{font-size:12px;color:var(--faint);text-align:center}
.nm{min-width:0}
.nm .a{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .a em{font-style:normal;color:var(--dim);font-weight:500;margin-right:5px}
.nm .b{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.spark{width:56px;height:26px;display:block}
.res{text-align:right}
.res .p{font-size:15px;font-weight:600}
.res .m{font-size:11px;color:var(--dim);white-space:nowrap}
.st{font-size:11px;width:14px;text-align:center}
.st.paused{color:var(--warn)}
.st.in{color:var(--sel)}.st.wait{color:var(--faint)}.st.target,.st.pass{color:var(--warn)}.st.fail{color:var(--down)}
.key{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px 10px;border-top:1px solid var(--line);font-size:11px;color:var(--dim)}

/* горизонтальные столбцы */
.bars{padding:2px 12px 10px}
.br{display:grid;grid-template-columns:minmax(0,104px) 1fr 70px;gap:8px;align-items:center;height:26px;font-size:12px;width:100%;text-align:left}
.br .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.br .l b{color:var(--text);font-weight:500}
.br .track{position:relative;height:12px}
.br .track::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1px solid var(--line)}
.br .fill{position:absolute;top:0;height:100%;border-radius:2px}
.br .fill.up{background:var(--up)}.br .fill.down{background:var(--down)}
.br .v{text-align:right;font-weight:600}
button.br:active{background:var(--raise)}

/* строки-списки */
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);min-height:44px}
.row .main{flex:1;min-width:0}
.row .t1{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{text-align:right;font-weight:600;white-space:nowrap}
.side{font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;flex:none}
.side.buy{background:var(--up-bg);color:var(--up)}.side.sell{background:var(--down-bg);color:var(--down)}
.ok-dot{width:8px;height:8px;border-radius:50%;flex:none}
.empty{padding:12px;color:var(--dim);font-size:13px;border-top:1px solid var(--line)}

/* карточка профиля */
.sheet{position:fixed;inset:0;z-index:6;background:var(--bg);overflow:auto;transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sh-top{display:flex;align-items:center;gap:10px;height:44px}
.back{color:var(--sel);font-size:15px;padding:6px 0;display:none}
html:not(.tg) .back{display:block}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:10px;white-space:nowrap}
.pill.paused{background:var(--warn-bg);color:var(--warn)}
.pill.in{background:var(--sel-bg);color:var(--sel)}.pill.wait{background:var(--raise);color:var(--dim)}
.pill.target,.pill.pass{background:var(--warn-bg);color:var(--warn)}.pill.fail{background:var(--down-bg);color:var(--down)}
.p-title{font-size:22px;font-weight:700;margin:2px 0 4px;letter-spacing:-.2px}
.p-title em{font-style:normal;color:var(--dim);font-weight:500;margin-right:6px}
.p-desc{color:var(--dim);font-size:13px;max-width:60ch;margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tag{font-size:11.5px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--dim)}
.tag b{color:var(--text);font-weight:500}
.p-eq{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px}
.p-eq .big{font-size:30px;font-weight:600;letter-spacing:-.5px}
.corr{padding:16px 12px 12px}
.cbar{position:relative;height:10px;border-radius:5px;background:var(--raise);margin:18px 0 8px}
.cbar .lost{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:repeating-linear-gradient(135deg,rgba(240,90,108,.55) 0 3px,rgba(240,90,108,.18) 3px 7px)}
.cbar .fl{position:absolute;top:0;bottom:0;background:rgba(110,168,254,.45)}
.cbar .tk{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--dim)}
.cbar .tk.stop{background:var(--down)}
.cbar .mk{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);border:3px solid var(--sel)}
.cbar .tl{position:absolute;bottom:14px;transform:translateX(-50%);font-size:10.5px;color:var(--down);white-space:nowrap}
.cends{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.cends b{display:block;color:var(--text);font-weight:500;font-size:12px}
.cends div:nth-child(2){text-align:center}.cends div:last-child{text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.grid div{background:var(--panel);padding:9px 10px;min-width:0}
.grid span{display:block;font-size:10.5px;color:var(--dim);margin-bottom:2px;white-space:nowrap}
.grid b{font-size:14px;font-weight:600}
@media (max-width:440px){.grid{grid-template-columns:repeat(2,1fr)}}

.acts{display:flex;gap:8px;margin:0 0 12px}
.acts.pad{padding:10px 12px;margin:0;border-top:1px solid var(--line)}
.btn{flex:1;min-height:42px;padding:9px 10px;border-radius:8px;background:var(--raise);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.btn:active{opacity:.7}.btn[disabled]{opacity:.45}
.btn.danger{color:var(--down);border-color:rgba(240,90,108,.45)}
.btn.go{color:var(--up);border-color:rgba(37,196,143,.4)}
.btn.armed{background:var(--down);color:#fff}
.ea-note{font-size:12px;color:var(--warn);margin:-4px 0 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.msg{padding:80px 20px;text-align:center;color:var(--dim);line-height:1.5}
.msg b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
/* пульт состояния: одним взглядом — торгует ли бот, открыт ли рынок, есть ли связь */
.verdict{padding:16px 0 12px}
.verdict h1{margin:0;font-size:22px;line-height:1.2;font-weight:700;letter-spacing:-.2px}
.verdict p{margin:4px 0 0;color:var(--dim);font-size:13.5px;line-height:1.4;max-width:60ch}
.verdict.ok h1{color:var(--up)}.verdict.bad h1{color:var(--down)}.verdict.warn h1{color:var(--warn)}.verdict.idle h1{color:var(--text)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.lamp{background:var(--panel);padding:10px 11px 11px;min-width:0;border-top:3px solid var(--faint)}
.lamp.ok{border-top-color:var(--up)}.lamp.bad{border-top-color:var(--down)}.lamp.warn{border-top-color:var(--warn)}.lamp.idle{border-top-color:var(--faint)}
.lamp .k{font-size:11px;color:var(--dim)}
.lamp .v{font-size:14.5px;font-weight:600;margin:3px 0 2px;line-height:1.2}
.lamp.ok .v{color:var(--up)}.lamp.bad .v{color:var(--down)}.lamp.warn .v{color:var(--warn)}
.lamp .d{font-size:11.5px;color:var(--dim);line-height:1.3}
@media (max-width:420px){.board{grid-template-columns:1fr}.lamp{display:grid;grid-template-columns:72px 1fr;column-gap:10px;border-top:0;border-left:3px solid var(--faint)}
  .lamp.ok{border-left-color:var(--up)}.lamp.bad{border-left-color:var(--down)}.lamp.warn{border-left-color:var(--warn)}
  .lamp .k{grid-row:span 2;align-self:center}.lamp .v{margin:0}}
.bots .row .t1{white-space:normal}
.bots .row .t2{white-space:normal}
.feed .row{min-height:0;align-items:flex-start}
.feed .when{font-size:11.5px;color:var(--dim);width:64px;flex:none;padding-top:1px}
.feed .t1{white-space:normal}
/* рынки: свечной график с уровнями сделки */
.mk-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.mk-tab{background:var(--panel);padding:8px 10px;text-align:left;min-width:0;position:relative}
.mk-tab[aria-pressed=true]{background:var(--raise)}
.mk-tab[aria-pressed=true]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--sel)}
.mk-tab .nm{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-tab .px{font-size:14px;font-weight:600;margin-top:1px}
.mk-tab .ch{font-size:11.5px}
.mk-tab .dot{position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--sel)}
@media (max-width:420px){.mk-tab{padding:7px 8px}.mk-tab .px{font-size:13px}}
.candles{position:relative;height:300px;touch-action:pan-y;user-select:none}
.candles svg{display:block;width:100%;height:100%}
.ctip{font-size:11.5px;color:var(--dim);padding:7px 12px 0;min-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctip b{color:var(--text);font-weight:600}
.posx{padding:10px 12px 12px;border-top:1px solid var(--line)}
.posx .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.side{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px}
.side.long{color:var(--up);background:var(--up-bg)}.side.short{color:var(--down);background:var(--down-bg)}
.posx .say{font-size:13px;line-height:1.45;margin-top:6px;color:var(--text)}
.posx .say span{color:var(--dim)}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.lv div{font-size:11px;color:var(--dim)}.lv b{display:block;font-size:13.5px;color:var(--text);font-weight:600}
.lv .s b{color:var(--down)}.lv .t b{color:var(--up)}
.gloss{padding:2px 12px 10px}
.gloss dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;line-height:1.4}
.gloss dt{font-weight:600}.gloss dd{margin:0;color:var(--dim)}
details.pnl summary{list-style:none;cursor:pointer}
details.pnl summary::-webkit-details-marker{display:none}
details.pnl summary .ph::after{content:"+";margin-left:auto;color:var(--dim);font-size:18px;line-height:1}
details.pnl[open] summary .ph::after{content:"−"}
/* конструктор стратегий */
.addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;border-top:1px solid var(--line);color:var(--sel);font-weight:600;font-size:14px}
.addbtn:active{background:var(--raise)}
.bld{position:fixed;inset:0;z-index:7;background:var(--bg);overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.bld.open{transform:none}
.bld h1{font-size:21px;margin:14px 0 2px;font-weight:700}
.bld .lead{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.45}
.fs{margin:0 0 16px}
.fs > .lb{font-size:12.5px;color:var(--dim);margin:0 0 7px;display:flex;justify-content:space-between;gap:8px}
.fs > .lb b{color:var(--text);font-weight:600}
.presets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px}
.presets::-webkit-scrollbar{display:none}
.preset{flex:none;width:168px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.preset b{display:block;font-size:13.5px;margin-bottom:3px}.preset span{font-size:11.5px;color:var(--dim);line-height:1.35;display:block}
.preset[aria-pressed=true]{border-color:var(--sel);background:var(--sel-bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{padding:9px 6px;border-radius:7px;font-weight:600;font-size:13px;color:var(--dim)}
.seg button[aria-pressed=true]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button[aria-pressed=true].l{color:var(--up)}.seg button[aria-pressed=true].s{color:var(--down)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tog{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:13.5px;font-weight:500;text-align:left}
.tog::before{content:"";width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);flex:none}
.tog[aria-pressed=true]{border-color:var(--sel)}
.tog[aria-pressed=true]::before{background:var(--sel);border-color:var(--sel);box-shadow:inset 0 0 0 3px var(--panel)}
.entries{display:grid;gap:6px}
.entry{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.entry b{font-size:14px}.entry span{display:block;font-size:12px;color:var(--dim);margin-top:2px;line-height:1.35}
.entry[aria-pressed=true]{border-color:var(--sel);background:var(--sel-bg)}
.rng{width:100%;accent-color:var(--sel);height:28px;margin:0}
.hint{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.4}
.hint.warn{color:var(--warn)}
.sw{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;text-align:left}
.sw .t{flex:1;font-size:13.5px}.sw .t span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.sw i{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:transform .15s}
.sw[aria-pressed=true] i{background:var(--up)}.sw[aria-pressed=true] i::after{transform:translateX(16px)}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.5}

<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData ? Telegram.WebApp : null;
if (tg) {
  document.documentElement.classList.add("tg");
  tg.ready(); tg.expand();
  try { tg.setHeaderColor("#0f141b"); tg.setBackgroundColor("#0f141b"); if (tg.setBottomBarColor) tg.setBottomBarColor("#0f141b"); } catch (e) {}
}
const haptic = (k) => { try { const h = tg && tg.HapticFeedback; if (!h) return; k === "sel" ? h.selectionChanged() : h.impactOccurred(k || "light"); } catch (e) {} };

/* ── формат ── */
const NB = " ";
const F = (d) => new Intl.NumberFormat("ru-RU", {minimumFractionDigits:d, maximumFractionDigits:d});
const f0 = F(0), f1 = F(1), f2 = F(2);
const sp = (s) => s.replace(/\s/g, NB);
const money = (v, d=2) => (v < 0 ? "−" : "") + sp((d ? f2 : f0).format(Math.abs(v)));
const sgn = (v, d=2) => (v > 0 ? "+" : v < 0 ? "−" : "") + sp((d ? f2 : f0).format(Math.abs(v)));
const pct = (v, d=2) => (v > 0 ? "+" : v < 0 ? "−" : "") + (d === 1 ? f1 : f2).format(Math.abs(v)) + "%";
const tone = (v) => v > 0.004 ? "up" : v < -0.004 ? "down" : "dim";
const dt = (t, o) => new Date(t*1000).toLocaleString("ru-RU", o || {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
const dur = (s) => { s = Math.max(0, Math.round(s)); const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  return d ? `${d}${NB}д ${h}${NB}ч` : h ? `${h}${NB}ч ${m}${NB}мин` : `${m}${NB}мин`; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const plural = (n, a, b, c) => { const m = n%10, h = n%100; return m===1&&h!==11 ? a : m>=2&&m<=4&&(h<12||h>14) ? b : c; };

/* DOM строится только через textContent — строки из MT5 никогда не попадают в innerHTML */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const SVG = (tag, attrs, ...kids) => {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of kids.flat()) if (c != null) el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return el;
};

const STATE = {in:["●","В рынке"], wait:["○","Ждёт сигнала"], paused:["⏸","Пауза"], target:["◎","Цель взята"], pass:["★","Этап пройден"], fail:["✕","Провал"]};

/* ── данные ── */
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let S = null, HIST = {}, loadedAt = 0, openId = null, P = null;
let range = store.get("range") || "7d", sortKey = store.get("sort") || "profit", pRange = "7d";

/* ── данные с GitHub: зашифрованный снимок, ключ только в ссылке из бота ── */
const QS = new URLSearchParams(location.search);
const KEY = QS.get("k") || "", REPO = QS.get("r") || "S010lvloon0day/ftmo-terminal", BOT = QS.get("b") || "S010ftnobot";
let SNAP = null, snapAt = 0, snapLoading = null;
const b64u = (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function fetchSnap() {
  if (!KEY) throw new Error("403");
  const urls = [`https://api.github.com/repos/${REPO}/contents/state.bin?ref=data&t=${Date.now()}`,
                `https://raw.githubusercontent.com/${REPO}/data/state.bin?t=${Date.now()}`];
  let buf = null;
  for (const [i, u] of urls.entries()) {
    try {
      const r = await fetch(u, {cache:"no-store", headers: i === 0 ? {"Accept":"application/vnd.github.raw"} : {}});
      if (r.ok) { buf = new Uint8Array(await r.arrayBuffer()); break; }
    } catch (e) {}
  }
  if (!buf) throw new Error("http");
  const key = await crypto.subtle.importKey("raw", b64u(KEY), "AES-GCM", false, ["decrypt"]);
  let plain;
  try { plain = await crypto.subtle.decrypt({name:"AES-GCM", iv: buf.slice(0, 12)}, key, buf.slice(12)); }
  catch (e) { throw new Error("403"); }
  const txt = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  SNAP = JSON.parse(txt); snapAt = Date.now();
}
async function api(path) {
  if (!SNAP || Date.now() - snapAt > 60000) {
    if (!snapLoading) snapLoading = fetchSnap().finally(() => { snapLoading = null; });
    try { await snapLoading; } catch (e) { if (!SNAP) throw e; }
  }
  const q = new URLSearchParams(path.split("?")[1] || "");
  const now = Math.floor(Date.now() / 1000), lag = Math.max(0, now - SNAP.t);
  if (path.startsWith("/api/state")) {
    const st = JSON.parse(JSON.stringify(SNAP.state));
    st.server_now = (st.server_now || SNAP.t) + lag;
    (st.accounts || []).forEach(a => { a.age = (a.age || 0) + lag; if (a.age > 600) a.online = false; });
    st.snapshot_age = lag;
    return st;
  }
  if (path.startsWith("/api/history")) return SNAP.hist[q.get("r") || "7d"] || {series:{}};
  if (path.startsWith("/api/profile")) {
    const p = (SNAP.prof[q.get("id")] || {})[q.get("r") || "7d"];
    if (!p) throw new Error("http 404");
    return {ok:true, profile:p};
  }
  throw new Error("http 404");
}

/* ── верхняя строка ── */
function renderTop() {
  const top = document.getElementById("top");
  if (!S || !S.has_data) { top.replaceChildren(h("span", {class:"led"}), h("span", {}, "Нет данных от MT5")); return; }
  const a = S.accounts[0];
  const allOn = S.accounts.every(x => x.online);
  top.replaceChildren(
    h("span", {class:"led " + (allOn ? "on" : "off")}),
    h("span", {class:"who"}, h("b", {}, `${S.title} ${S.phase}`), S.accounts.length > 1 ? ` · ${S.accounts.length} счетов` : ` #${a.login}`),
    h("span", {class:"sp n", id:"clock"}));
  tick();
}
function tick() {
  const c = document.getElementById("clock"); if (!c || !S || !S.has_data) return;
  const el = Math.round((Date.now() - loadedAt) / 1000);
  const a = S.accounts[0], age = Math.min(...S.accounts.map(x => x.age)) + el;
  const parts = [age < 90 ? "данные свежие" : `данные ${dur(age)} назад`];
  if (a.day_reset_at) { const left = a.day_reset_at - (S.server_now + el); if (left > 0) parts.push(`новый день ${Math.floor(left/3600)}:${String(Math.floor(left%3600/60)).padStart(2,"0")}`); }
  c.textContent = parts.join("  ·  ");
}

/* ── пульт состояния ── */
// Часы торговли индексов и золота (CFD): с вс 18:00 до пт 17:00 по Нью-Йорку, перерыв каждый день 17:00–18:00.
function nyParts(ms) {
  const f = new Intl.DateTimeFormat("en-US", {timeZone:"America/New_York", weekday:"short", hour:"numeric", minute:"numeric", hourCycle:"h23"});
  const o = {}; f.formatToParts(new Date(ms)).forEach(p => o[p.type] = p.value);
  return {wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday), m:(+o.hour) * 60 + (+o.minute)};
}
function marketOpenAt(ms) {
  const {wd, m} = nyParts(ms);
  if (wd === 6) return false;                       // суббота
  if (wd === 0) return m >= 18*60;                  // воскресенье с 18:00
  if (wd === 5) return m < 17*60;                   // пятница до 17:00
  return m < 17*60 || m >= 18*60;                   // будни: перерыв 17–18
}
function marketInfo() {
  const now = Date.now(), open = marketOpenAt(now);
  let t = now - now % 60000;
  for (let i = 0; i < 60*24*3 && marketOpenAt(t) === open; i++) t += 60000;
  const {wd, m} = nyParts(now);
  const weekend = !open && (wd === 6 || wd === 0 || (wd === 5 && m >= 17*60));
  const at = new Date(t).toLocaleString("ru-RU", {weekday:"short", hour:"2-digit", minute:"2-digit"});
  return {open, weekend, next:t, at, left:(t - now) / 1000};
}
function plainAgo(s) { return s < 90 ? "только что" : `${dur(s)} назад`; }
function nextCheck(p) {
  const ea = p.ea || {};
  if (!ea.next_decision) return "";
  return new Date(ea.next_decision * 1000).toLocaleString("ru-RU", {weekday:"short", hour:"2-digit", minute:"2-digit"});
}
function botLine(p, mk) {
  const ea = p.ea || {}, n = p.positions.length;
  const pl = p.positions.reduce((s, x) => s + (x.profit || 0) + (x.swap || 0), 0);
  const often = /час/.test(p.time || "") ? "проверяет рынок каждый час" : `решает раз в день (${p.time || "вечером"} по серверу)`;
  if (ea.halted) return {c:"bad", t:`${p.id} остановлен: сработал лимит убытка или достигнута цель`, d:"Новых сделок не будет до сброса этапа."};
  if (ea.day_halt) return {c:"warn", t:`${p.id} на паузе до завтра: дневной лимит`, d:"Позиции закрыты, завтра продолжит сам."};
  if (p.state === "paused" || ea.paused) return {c:"warn", t:`${p.id} на паузе — включили вручную`, d:"Новых сделок нет. Снять паузу — в карточке профиля."};
  if (n) return {c:"ok", t:`${p.id} в сделке: ${n} ${plural(n, "позиция", "позиции", "позиций")}, сейчас ${sgn(pl, 0)}${NB}$`,
    d:`${p.positions.map(x => `${x.sym.replace(".sim", "")} ${f2.format(x.vol)}`).join(", ")}. ${!mk.open ? "Рынок закрыт — позиции ждут открытия." : p.positions.some(x => x.sl) ? "Выйдет по стопу или тейку." : `Держит, пока сигнал в силе; пересмотр ${nextCheck(p) || "вечером"}.`}`};
  const nc = nextCheck(p);
  return {c:"idle", t:`${p.id} ждёт сигнала, сделок нет`, d:`${often[0].toUpperCase() + often.slice(1)}${nc ? `, следующая проверка ${nc}` : ""}.`};
}
function statusBoard() {
  const a = S.accounts[0], t = a.terminal || {}, mk = marketInfo();
  const el = Math.round((Date.now() - loadedAt) / 1000), age = a.age + el;
  const live = age < 300, algo = t.trade_allowed && t.expert_allowed;
  const inTrade = S.profiles.reduce((s, p) => s + p.positions.length, 0);
  const pl = S.profiles.reduce((s, p) => s + p.positions.reduce((q, x) => q + (x.profit || 0) + (x.swap || 0), 0), 0);
  const stopped = S.profiles.filter(p => (p.ea || {}).halted || (p.ea || {}).paused || p.state === "paused").length;

  // связь
  const conn = !live ? {c:"bad", v:"Нет связи", d:`MT5 молчит ${dur(age)}. Проверьте Mac mini.`}
    : !t.connected ? {c:"bad", v:"Нет брокера", d:"MT5 запущен, но не подключён к серверу."}
    : !algo ? {c:"bad", v:"Алготорговля выкл.", d:"Кнопка «Алготорговля» в MT5 выключена."}
    : {c:"ok", v:"На связи", d:`Обновлено ${plainAgo(age)}`};
  // рынок
  const mkt = mk.open ? {c:"ok", v:"Открыт", d:`Закроется ${mk.at} (через ${dur(mk.left)})`}
    : {c:"idle", v:mk.weekend ? "Выходные" : "Перерыв", d:`Откроется ${mk.at} (через ${dur(mk.left)})`};
  // бот
  const bot = !live || !algo ? {c:"bad", v:"Не торгует", d: inTrade ? "Стопы у брокера продолжают работать." : "Сделок нет."}
    : stopped === S.profiles.length ? {c:"warn", v:"Остановлен", d:"Все профили на паузе или остановлены."}
    : inTrade ? {c:"ok", v:`${inTrade} ${plural(inTrade, "сделка", "сделки", "сделок")}`, d:`Сейчас ${sgn(pl, 0)}${NB}$`}
    : {c:"idle", v:"Ждёт сигнала", d: mk.open ? "Входит, когда условия совпадут." : "Проверит сигналы после открытия."};

  // главный вывод — одной фразой
  let vc, vh, vp;
  if (!live) { vc = "bad"; vh = "Торговля стоит: MT5 не на связи"; vp = `Последние данные ${dur(age)} назад. Проверьте, что Mac mini включён и MetaTrader 5 запущен. Сторож перезапускает MT5 сам в течение 2 минут.`; }
  else if (!t.connected || !algo) { vc = "bad"; vh = "Торговля стоит"; vp = conn.d; }
  else if (stopped === S.profiles.length) { vc = "warn"; vh = "Бот на паузе"; vp = "Новые сделки не открываются. Снять паузу можно внизу страницы."; }
  else if (!mk.open) { vc = "idle"; vh = mk.weekend ? "Рынок на выходных — бот ждёт" : "Перерыв на рынке — бот ждёт";
    vp = `Торги откроются ${mk.at}. ${inTrade ? `Открытые позиции (${inTrade}) переносятся, стопы у брокера работают.` : "Открытых позиций нет."}`; }
  else if (inTrade) { vc = "ok"; vh = `Бот торгует: ${inTrade} ${plural(inTrade, "сделка открыта", "сделки открыты", "сделок открыто")}`;
    vp = `Сейчас по открытым сделкам ${sgn(pl, 0)}${NB}$. Бот сам закроет их по стопу, тейку или своему сигналу.`; }
  else { vc = "ok"; vh = "Бот работает и ждёт сигнала"; vp = "Рынок открыт, связь есть. Сделок пока нет: условия входа не совпали. Это нормально."; }

  const lamp = (k, x) => h("div", {class:"lamp " + x.c}, h("div", {class:"k"}, k), h("div", {class:"v"}, x.v), h("div", {class:"d"}, x.d));
  const bots = S.profiles.map(p => {
    const b = live ? botLine(p, mk) : {c:"bad", t:`${p.id}: данные устарели`, d:`Последнее известное: ${botLine(p, mk).t.replace(p.id + " ", "")}.`};
    return h("button", {class:"row", style:"width:100%;text-align:left", onclick: () => openProfile(p.id)},
      h("span", {class:"ok-dot", style:`background:var(--${b.c === "idle" ? "faint" : b.c === "ok" ? "up" : b.c === "bad" ? "down" : "warn"})`}),
      h("div", {class:"main"}, h("div", {class:"t1"}, h("b", {}, b.t)), h("div", {class:"t2"}, b.d)));
  });
  return h("section", {},
    h("div", {class:"verdict " + vc, role:"status"}, h("h1", {}, vh), h("p", {}, vp)),
    h("div", {class:"board"}, lamp("Связь с MT5", conn), lamp("Рынок", mkt), lamp("Бот", bot)),
    marketsPanel(),
    h("section", {class:"pnl bots"}, h("div", {class:"ph"}, h("h2", {}, "Стратегии на счёте"), h("span", {class:"note", style:"margin-left:auto"}, "нажмите — подробно")), bots,
      h("button", {class:"addbtn", onclick: () => openBuilder()}, "＋ Собрать свою стратегию")),
    feedPanel(), glossaryPanel());
}

/* лента: последние сделки всех профилей простыми словами */
let FEED = [];
async function loadFeed() {
  const out = [];
  for (const p of S.profiles) {
    try {
      const r = await api(`/api/profile?id=${encodeURIComponent(p.id)}&r=7d`);
      ((r.profile || {}).trades || []).forEach(t => out.push({p:p.id, t}));
    } catch (e) {}
  }
  FEED = out.sort((a, b) => b.t.t_close - a.t.t_close).slice(0, 6);
  const box = document.getElementById("feed"); if (box) box.replaceWith(feedPanel());
}
function feedPanel() {
  const open = [];
  S.profiles.forEach(p => p.positions.forEach(x => open.push({p:p.id, x})));
  open.sort((a, b) => (b.x.t || 0) - (a.x.t || 0));
  const when = (ts) => new Date(ts * 1000).toLocaleString("ru-RU", {weekday:"short", hour:"2-digit", minute:"2-digit"});
  const side = (s) => s === "buy" ? "купил (лонг ↑)" : "продал (шорт ↓)";
  const rows = [
    ...open.slice(0, 6).map(({p, x}) => h("div", {class:"row"}, h("span", {class:"when n"}, x.t ? when(x.t) : ""),
      h("div", {class:"main"}, h("div", {class:"t1"}, `${p} ${side(x.type)} ${x.sym.replace(".sim", "")} ${f2.format(x.vol)} — сделка открыта`),
        h("div", {class:"t2"}, x.sl ? `Стоп ${f2.format(x.sl)}${x.tp ? `, тейк ${f2.format(x.tp)}` : ""}` : "Выход по сигналу стратегии")),
      h("div", {class:"val n " + tone(x.profit)}, sgn(x.profit, 0)))),
    ...FEED.map(({p, t}) => h("div", {class:"row"}, h("span", {class:"when n"}, when(t.t_close)),
      h("div", {class:"main"}, h("div", {class:"t1"}, t.open ? `${p} ${side(t.side)} ${t.sym.replace(".sim", "")} ${f2.format(t.vol)} — закрыта ${t.profit >= 0 ? "в плюс" : "в минус"}`
          : `Закрыта позиция старой стратегии: ${t.sym.replace(".sim", "")} ${f2.format(t.vol)}`),
        h("div", {class:"t2"}, t.open ? `Вход ${f2.format(t.open)}, выход ${f2.format(t.close)}` : `Выход ${f2.format(t.close)}`)),
      h("div", {class:"val n " + tone(t.profit)}, sgn(t.profit, 0))))];
  return h("section", {class:"pnl feed", id:"feed"}, h("div", {class:"ph"}, h("h2", {}, "Последние сделки"), h("span", {class:"note", style:"margin-left:auto"}, "за 7 дней, $")),
    rows.length ? rows : h("div", {class:"empty"}, "Сделок за неделю не было. Как только бот войдёт в рынок, сделка появится здесь."));
}

/* ── рынки и сделки ── */
const SYMN = {"US100.sim":"Nasdaq 100", "US500.sim":"S&P 500", "US30.sim":"Dow Jones", "XAUUSD.sim":"Золото"};
const symName = (s) => SYMN[s] || s.replace(".sim", "");
let mkSym = store.get("mkSym") || "US100.sim";
const fmtPx = (v, dg) => sp(new Intl.NumberFormat("ru-RU", {minimumFractionDigits:dg, maximumFractionDigits:dg}).format(v));

function allPositions() {
  const out = [];
  S.profiles.forEach(p => p.positions.forEach(x => out.push(Object.assign({pid:p.id}, x))));
  return out;
}
function marketsPanel() {
  const Q = S.quotes || {};
  const syms = Object.keys(Q);
  if (!syms.length) return h("section", {class:"pnl"}, h("div", {class:"ph"}, h("h2", {}, "Рынки и сделки")),
    h("div", {class:"empty"}, "Графики появятся через минуту после обновления советника FTMOStatus в MT5."));
  if (!Q[mkSym]) mkSym = syms[0];
  const pos = allPositions();
  const tabs = h("div", {class:"mk-tabs", role:"tablist"}, syms.map(s => {
    const q = Q[s], ch = q.prev ? (q.bid / q.prev - 1) * 100 : 0, has = pos.some(x => x.sym === s);
    return h("button", {class:"mk-tab", role:"tab", "aria-pressed":String(s === mkSym), onclick: () => { mkSym = s; store.set("mkSym", s); haptic("sel");
        document.getElementById("mkt").replaceWith(marketsPanel()); }},
      has ? h("span", {class:"dot", title:"есть открытая сделка"}) : null,
      h("div", {class:"nm"}, symName(s)), h("div", {class:"px n"}, fmtPx(q.bid, q.digits > 2 ? 2 : q.digits)),

function lineChart(box, series, opts) {
  /* series: [{id, label, pts:[[t,v]...]}]; одна выделенная линия, остальные приглушены */
  const W = Math.max(280, box.clientWidth), H = opts.height || 200, L = 8, R = W - 52, T = 12, B = H - 22;
  const all = series.flatMap(s => s.pts);
  box.replaceChildren();
  if (all.length < 2) { box.append(h("div", {class:"empty", style:"border:0"}, "График наполняется: точка добавляется раз в минуту.")); return; }
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]));
  let lo = Math.min(...all.map(p => p[1]), opts.base ?? 0), hi = Math.max(...all.map(p => p[1]), opts.base ?? 0);
  if (opts.single && opts.base != null) { lo = Math.min(...all.map(p => p[1]), opts.base); hi = Math.max(...all.map(p => p[1]), opts.base); }
  const pad = (hi - lo) * 0.12 || 0.5; lo -= pad; hi += pad;
  const X = (t) => L + (R - L) * (t - t0) / Math.max(1, t1 - t0), Y = (v) => B - (B - T) * (v - lo) / (hi - lo);
  const svg = SVG("svg", {viewBox:`0 0 ${W} ${H}`, height:H, role:"img", "aria-label":opts.aria || "График"});
  for (let i = 0; i <= 2; i++) {
    const v = lo + pad + (hi - lo - 2*pad) * i / 2, y = Y(v);
    svg.append(SVG("line", {x1:L, x2:R, y1:y, y2:y, stroke:"var(--line)", "stroke-width":1}));
    svg.append(SVG("text", {x:R + 6, y:y + 4, "font-size":10.5, fill:"var(--faint)"}, opts.fmt(v)));
  }
  if (opts.base != null) svg.append(SVG("line", {x1:L, x2:R, y1:Y(opts.base), y2:Y(opts.base), stroke:"var(--dim)", "stroke-width":1, "stroke-dasharray":"3 3"}));
  const path = (pts) => pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const g = SVG("g", {}), lines = {};
  if (opts.single && series[0] && series[0].pts.length > 1) {
    const s = series[0], last = s.pts[s.pts.length - 1];
    const col = last[1] >= opts.base ? "var(--up)" : "var(--down)";
    g.append(SVG("path", {d:path(s.pts) + `L${X(last[0])} ${B}L${X(s.pts[0][0])} ${B}Z`, fill:col, opacity:.08}));
  }
  series.forEach(s => { if (s.pts.length < 2) return;
    const el = SVG("path", {d:path(s.pts), fill:"none", stroke:"var(--faint)", "stroke-width":1.25, "stroke-linejoin":"round", opacity:.5});
    lines[s.id] = el; g.append(el); });
  svg.append(g);
  const fmtT = (t1 - t0) > 2*86400 ? {day:"numeric", month:"short"} : {hour:"2-digit", minute:"2-digit"};
  svg.append(SVG("text", {x:L, y:H - 5, "font-size":10.5, fill:"var(--faint)"}, dt(t0, fmtT)));
  svg.append(SVG("text", {x:R, y:H - 5, "font-size":10.5, fill:"var(--faint)", "text-anchor":"end"}, dt(t1, fmtT)));
  const xl = SVG("line", {y1:T - 6, y2:B, stroke:"var(--dim)", "stroke-width":1, opacity:0});
  const dot = SVG("circle", {r:4.5, fill:"var(--sel)", stroke:"var(--panel)", "stroke-width":2, opacity:0});
  const endLbl = SVG("text", {"font-size":11.5, "font-weight":600, fill:"var(--sel)"});
  svg.append(xl, endLbl, dot);
  const hit = SVG("rect", {x:0, y:0, width:W, height:H, fill:"transparent"});
  svg.append(hit);
  box.append(svg);
  const tip = h("div", {class:"tip"}); box.append(tip);

  let sel = opts.hi && lines[opts.hi] ? opts.hi : (series.find(s => s.pts.length > 1) || {}).id;
  const highlight = (id) => {
    sel = id;
    for (const [k, el] of Object.entries(lines)) {
      const on = k === id;
      el.setAttribute("stroke", on ? (opts.single ? "var(--sel)" : "var(--sel)") : "var(--faint)");
      el.setAttribute("stroke-width", on ? 2.25 : 1.25);
      el.setAttribute("opacity", on ? 1 : .5);
      if (on) g.append(el);
    }
    const s = series.find(x => x.id === id); if (!s || s.pts.length < 2) return;
    const last = s.pts[s.pts.length - 1];
    endLbl.setAttribute("x", X(last[0]) - 6); endLbl.setAttribute("text-anchor", "end"); endLbl.setAttribute("y", clamp(Y(last[1]) - 8, T + 6, B));
    endLbl.textContent = opts.single ? "" : s.id;
  };
  highlight(sel);
  let lastKey = "";
  const move = (ev) => {
    const r = box.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width), py = (ev.clientY - r.top) * (H / r.height);
    const t = t0 + (px - L) / (R - L) * (t1 - t0);
    let best = null;
    for (const s of series) {
      if (s.pts.length < 2) continue;
      let i = 0, bd = Infinity;
      for (let k = 0; k < s.pts.length; k++) { const d = Math.abs(s.pts[k][0] - t); if (d < bd) { bd = d; i = k; } }
      const p = s.pts[i], dy = opts.single ? 0 : Math.abs(Y(p[1]) - py);
      if (!best || dy < best.dy) best = {s, p, dy};
    }
    if (!best) return;
    const {s, p} = best, x = X(p[0]), y = Y(p[1]);
    if (s.id !== sel) highlight(s.id);
    xl.setAttribute("x1", x); xl.setAttribute("x2", x); xl.setAttribute("opacity", 1);
    dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("opacity", 1);
    tip.replaceChildren(h("b", {class:"n " + tone(p[1] - (opts.base || 0))}, opts.fmt(p[1], true)),
      opts.single ? null : h("div", {}, s.label), h("div", {class:"t"}, dt(p[0])));
    tip.style.opacity = 1;
    const tw = tip.offsetWidth; tip.style.left = clamp(x / W * r.width - tw / 2, 4, r.width - tw - 4) + "px";
    const key = s.id + p[0]; if (key !== lastKey) { lastKey = key; haptic("sel"); }
  };
  const leave = () => { xl.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); tip.style.opacity = 0; };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", leave);
  hit.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") setTimeout(leave, 1500); });
}

        h("div", {class:"cends n"}, h("div", {}, h("b", {}, money(lo, 0)), "провал"), h("div", {}, h("b", {}, money(m.initial, 0)), "старт"),
          h("div", {}, h("b", {}, money(hiv, 0)), "цель +" + S.target_pct + "%"))),
      h("div", {class:"grid"},
        stat("До цели", m.target_hit ? "взята" : "+" + money(m.target_left, 0), m.target_hit ? "warn" : ""),
        stat("Можно потерять", money(Math.max(0, m.room), 0), m.room < m.daily_limit * 0.3 ? "down" : ""),
        stat("Дневной лимит", `${f0.format(m.daily_used)}%`, m.daily_used >= 50 ? "warn" : ""),
        stat("Общий лимит", `${f0.format(m.max_used)}%`, m.max_used >= 50 ? "warn" : ""))),
    h("section", {class:"pnl"},
      h("div", {class:"ph"}, h("h2", {}, "Статистика сделок")),
      h("div", {class:"grid", style:"border-top:0"},
        stat("Сделок", s.trades), stat("В плюс", s.winrate != null ? f0.format(s.winrate) + "%" : "—"),
        stat("Профит-фактор", s.pf != null ? f2.format(s.pf) : "—", s.pf != null ? (s.pf >= 1 ? "up" : "down") : ""),
        stat("Макс. просадка", p.max_dd != null ? pct(-p.max_dd) : "—", p.max_dd > 3 ? "down" : ""),
        stat("Средняя прибыль", s.avg_win != null ? sgn(s.avg_win, 0) : "—", "up"),
        stat("Средний убыток", s.avg_loss != null ? sgn(s.avg_loss, 0) : "—", "down"),
        stat("Лучшая", s.best != null ? sgn(s.best, 0) : "—", "up"),
        stat("Худшая", s.worst != null ? sgn(s.worst, 0) : "—", "down"))),
    h("section", {class:"pnl"},
      h("div", {class:"ph"}, h("h2", {}, "Средства профиля"),
        tabs(pRange, RANGES, (k) => { pRange = k; loadProfile(); }, "Период")),
      h("div", {class:"chart", id:"pChart"})),
  ];
  const syms = Object.entries(p.by_symbol || {});
  if (syms.length) pieces.push(h("section", {class:"pnl"}, h("div", {class:"ph"}, h("h2", {}, "Результат по инструментам, $")),
    barsBlock(syms.map(([k, v]) => ({l:k, v})))));
  pieces.push(h("section", {class:"pnl"},
    h("div", {class:"ph"}, h("h2", {}, "Открытые позиции"), p.positions.length ? h("span", {class:"note n", style:"margin-left:auto"}, `плавающий ${sgn(m.floating)}`) : null),
    p.positions.length ? p.positions.map(x => h("div", {class:"row"},
      h("span", {class:"side " + x.type}, x.type === "buy" ? "BUY" : "SELL"),
      h("div", {class:"main"}, h("div", {class:"t1 n"}, `${x.sym} ${x.vol}`),
        h("div", {class:"t2 n"}, `${x.open} → ${x.cur}${x.sl ? " · SL " + x.sl : ""} · ${dur(S.server_now - x.t)}`)),
      h("div", {class:"val n " + tone(x.profit)}, sgn(x.profit))))
    : h("div", {class:"empty"}, "Позиций нет — профиль ждёт сигнала.")));
  const tr = p.trades;
  pieces.push(h("section", {class:"pnl"},
    h("div", {class:"ph"}, h("h2", {}, "История сделок"), tr && tr.length ? h("span", {class:"note", style:"margin-left:auto"}, `последние ${tr.length}`) : null),
    tr == null ? h("div", {class:"empty"}, "Загружаю…")
    : tr.length ? tr.slice(0, 40).map(x => h("div", {class:"row"},
        h("span", {class:"side " + x.side}, x.side === "buy" ? "BUY" : "SELL"),
        h("div", {class:"main"}, h("div", {class:"t1 n"}, `${x.sym} ${x.vol}`),
          h("div", {class:"t2 n"}, `${x.open != null ? x.open + " → " : ""}${x.close} · ${dt(x.t_close)}${x.t_open ? " · " + dur(x.t_close - x.t_open) : ""}`)),
        h("div", {class:"val n " + tone(x.profit)}, sgn(x.profit))))
    : h("div", {class:"empty"}, "Закрытых сделок пока нет.")));
  body.replaceChildren(...pieces.filter(Boolean));
  document.getElementById("sheet").scrollTop = y;
  const box = document.getElementById("pChart");
  if (p.history) lineChart(box, [{id:p.id, label:p.name, pts:p.history}], {height:180, single:true, base:m.initial,
    fmt:(v, full) => full ? money(v) : f1.format(v / 1000) + "K", aria:"Средства профиля"});
  else box.append(h("div", {class:"empty", style:"border:0"}, "Загружаю график…"));
}

/* ── управление ── */
function toast(t) {
  let el = document.getElementById("toast");
  if (!el) { el = h("div", {class:"toast", id:"toast", role:"status"}); document.body.append(el); }
  el.textContent = t; el.classList.add("on");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 3500);
}
function confirmAsk(text, btn) {
  return new Promise((res) => {
    if (tg && tg.showConfirm) { try { tg.showConfirm(text, (ok) => res(!!ok)); return; } catch (e) {} }
    // вне Telegram: второе нажатие в течение 4 с подтверждает
    if (btn.classList.contains("armed")) { btn.classList.remove("armed"); res(true); return; }
    const old = btn.textContent; btn.classList.add("armed"); btn.textContent = "Нажмите ещё раз";
    setTimeout(() => { btn.classList.remove("armed"); btn.textContent = old; }, 4000); res(false);
  });
}
async function doAction(btn, id, action, question) {
  // страница на GitHub не связана с Mac напрямую — команду выполняет бот (там же подтверждение)
  haptic(action === "close" || action === "stopall" ? "heavy" : "medium");
  const link = `https://t.me/${BOT}?start=act_${action}_${id}`;
  toast("Открываю бота — подтвердите команду там");
  try { if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); return; } } catch (e) {}
  location.href = link;
}
function signalNote(p) {
  const ea = p.ea || {};
  if (ea.signal == null) return null;
  const s = ea.signal;
  const txt = s < 0 ? "нет данных — на сервере мало дневной истории" : s === 0 ? "вне рынка (условия не выполнены)" : `купить, доля ${Math.round(s * 100)}% от риска`;
  const nd = ea.next_decision ? new Date(ea.next_decision * 1000).toLocaleString("ru-RU", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "—";
  return h("section", {class:"pnl"}, h("div", {class:"grid", style:"border-top:0;grid-template-columns:1fr 1fr"},
    h("div", {}, h("span", {}, "Сигнал сейчас (без сделки)"), h("b", {class: s > 0 ? "up" : s < 0 ? "down" : ""}, txt)),
    h("div", {}, h("span", {}, "Следующее решение"), h("b", {}, nd))));
}
function profileActions(p) {
  const paused = p.state === "paused" || (p.ea && (p.ea.paused || p.ea.want_pause));
  const name = `${p.id} ${p.name}`;
  const pb = h("button", {class:"btn " + (paused ? "go" : ""), onclick: (e) => doAction(e.currentTarget, p.id, paused ? "resume" : "pause")},
    paused ? "▶ Продолжить" : "⏸ Пауза");
  const cb = h("button", {class:"btn danger", onclick: (e) => doAction(e.currentTarget, p.id, "close",
    `Закрыть все позиции ${name} и поставить профиль на паузу?`)}, "✕ Закрыть позиции");
  const nb = h("button", {class:"btn", onclick: (e) => doAction(e.currentTarget, p.id, "now",
    `${name}: принять решение сейчас по текущим ценам, не дожидаясь вечернего окна?`)}, "⚡ Решить сейчас");
  const del = p.custom ? h("div", {class:"acts"}, h("button", {class:"btn", onclick: () => { haptic("light"); openBot("act_delete_" + p.id); }}, "🗑 Удалить стратегию"),
    h("button", {class:"btn", onclick: () => openBuilder(p.code)}, "✎ Собрать похожую")) : null;
  return [h("div", {class:"acts"}, pb, nb, cb), del,
    p.ea && p.ea.now_pending ? h("div", {class:"ea-note"}, "Решение отправлено — советник выполнит, как только рынок открыт (обычно за 10–60 секунд)…") : null,
    p.ea && p.ea.close_pending ? h("div", {class:"ea-note"}, "Команда на закрытие отправлена — ждём подтверждения от MT5…") : null,
    p.ea && p.ea.want_pause && !p.ea.paused ? h("div", {class:"ea-note"}, "Пауза отправлена — ждём подтверждения от MT5…") : null];
}

/* ── загрузка ── */
async function loadState() {
  try {
    S = await api("/api/state"); loadedAt = Date.now();
    if (!FEED.length || Date.now() - (window._feedAt || 0) > 60000) { window._feedAt = Date.now(); loadFeed(); }
    const y = window.scrollY; render(); window.scrollTo(0, y);
    if (openId) loadProfile();
  } catch (e) {
    if (S) return;
    document.getElementById("app").replaceChildren(e.message === "403"
      ? h("div", {class:"msg"}, h("b", {}, "Нет доступа"), "Откройте терминал кнопкой «Терминал» в боте — в ссылке должен быть ключ.")
      : h("div", {class:"msg"}, h("b", {}, "Данные пока недоступны"), "Не удалось загрузить данные с GitHub. Проверьте интернет — повторяю каждые 10 секунд."));
  }
}
async function loadHistory() {
  const box = document.getElementById("perfChart"); if (box) box.style.opacity = .5;
  try { HIST = (await api("/api/history?r=" + range)).series || {}; } catch (e) {}
  if (box) box.style.opacity = "";
  drawPerf();
}
loadState().then(loadHistory);
setInterval(loadState, 10000);
setInterval(loadHistory, 60000);
setInterval(tick, 1000);
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawPerf(); { const m = document.getElementById("mkt"); if (m && S) m.replaceWith(marketsPanel()); } if (openId) renderProfile(); }, 150); });
</script>
